<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#000;
    overflow:hidden;
}

/* START SCREEN */

#startScreen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at center,#111,#000);
}

.logo{
    font-size:5rem;
    color:#00ff88;
    text-shadow:0 0 25px #00ff88;
    margin-bottom:25px;
}

.tagline{
    color:#aaa;
    margin-bottom:35px;
}

.startBtn{
    padding:16px 45px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:#000;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.startBtn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00ff88;
}

/* BOOT SCREEN */

#bootScreen{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    color:#00ff88;
    padding:40px;
}

#terminal{
    white-space:pre-wrap;
    line-height:1.8;
    font-size:1rem;
}

.progressContainer{
    margin-top:25px;
    width:100%;
    max-width:900px;
    border:1px solid #00ff88;
    height:22px;
}

.progressBar{
    width:0%;
    height:100%;
    background:#00ff88;
    transition:.4s;
}

/* ABOUT SCREEN */

#aboutScreen{
    display:none;
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top,#181818,#000);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
}

.aboutTitle{
    font-size:5rem;
    margin-bottom:20px;
    color:#00ff88;
}

.aboutText{
    max-width:800px;
    font-size:1.1rem;
    line-height:1.8;
    color:#cccccc;
    margin-bottom:40px;
}

.enterBtn{
    padding:16px 45px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:#000;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.enterBtn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00ff88;
}

.fade{
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}
</style>
</head>
<body>

<!-- START SCREEN -->

<div id="startScreen">
    <div class="logo">NOVA AI</div>
    <div class="tagline">Advanced Artificial Intelligence System</div>

    <button class="startBtn" onclick="startNova()">
        START SYSTEM
    </button>
</div>

<!-- BOOT SCREEN -->

<div id="bootScreen">
    <div id="terminal"></div>

    <div class="progressContainer">
        <div class="progressBar" id="progressBar"></div>
    </div>
</div>

<!-- ABOUT SCREEN -->

<div id="aboutScreen">
    <h1 class="aboutTitle">NOVA AI</h1>

    <p class="aboutText">
        Nova AI is a next-generation intelligent assistant designed
        to help users learn, create, code, research, and solve
        complex problems. Built with speed, intelligence, and a
        futuristic experience in mind.
    </p>

    <button class="enterBtn" onclick="enterNova()">
        ENTER NOVA AI
    </button>
</div>

<!-- SOUND -->

<audio id="startupSound">
    <source src="assets/startup.mp3" type="audio/mpeg">
</audio>

<script>

const bootLines = [
"> Initializing Nova Core...",
"> Loading Neural Engine...",
"> Connecting Intelligence Modules...",
"> Running Security Protocols...",
"> Syncing Knowledge Database...",
"> Loading Voice Systems...",
"> Starting Runtime Services...",
"> Final System Check...",
"> Nova AI Online."
];

function startNova(){

    const sound = document.getElementById("startupSound");

    sound.play().catch(() => {});

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("bootScreen").style.display = "block";

    const terminal = document.getElementById("terminal");
    const progress = document.getElementById("progressBar");

    let current = 0;

    const interval = setInterval(() => {

        if(current < bootLines.length){

            terminal.innerHTML += bootLines[current] + "\n";

            progress.style.width =
            ((current + 1) / bootLines.length) * 100 + "%";

            current++;

        } else {

            clearInterval(interval);

            setTimeout(() => {

                document.getElementById("bootScreen").style.display = "none";

                const about =
                document.getElementById("aboutScreen");

                about.style.display = "flex";
                about.classList.add("fade");

            },1000);
        }

    },800);
}

function enterNova(){

    // Replace this with your chat page
    // Example:
    // window.location.href = "chat.html";

    alert("Welcome to Nova AI!");
}
</script>

</body>
</html>
