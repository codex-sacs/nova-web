<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#000;
    color:#00ff88;
    height:100vh;
    overflow:hidden;
}

/* START SCREEN */

#startScreen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
}

.logo{
    font-size:4rem;
    margin-bottom:20px;
    text-shadow:0 0 20px #00ff88;
}

.startBtn{
    padding:15px 40px;
    border:none;
    background:#00ff88;
    color:#000;
    font-size:1.2rem;
    cursor:pointer;
    border-radius:8px;
    transition:.3s;
}

.startBtn:hover{
    transform:scale(1.05);
}

/* BOOT SCREEN */

#bootScreen{
    display:none;
    padding:30px;
    height:100vh;
    background:black;
}

#terminal{
    white-space:pre-wrap;
    line-height:1.8;
}

.progress{
    margin-top:20px;
    width:100%;
    height:20px;
    border:1px solid #00ff88;
}

.bar{
    width:0%;
    height:100%;
    background:#00ff88;
}

/* ABOUT SCREEN */

#aboutScreen{
    display:none;
    position:absolute;
    inset:0;
    background:#050505;
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
}

#aboutScreen h1{
    font-size:4rem;
    margin-bottom:20px;
}

#aboutScreen p{
    max-width:700px;
    opacity:.8;
    margin-bottom:30px;
}

.enterBtn{
    padding:15px 40px;
    border:none;
    background:#00ff88;
    color:black;
    font-size:1rem;
    cursor:pointer;
    border-radius:8px;
}
</style>
</head>
<body>

<!-- START -->

<div id="startScreen">
    <div class="logo">NOVA AI</div>
    <button class="startBtn" onclick="startNova()">
        START SYSTEM
    </button>
</div>

<!-- BOOT -->

<div id="bootScreen">
    <div id="terminal"></div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>
</div>

<!-- ABOUT -->

<div id="aboutScreen">
    <h1>NOVA AI</h1>

    <p>
        Nova AI is an intelligent assistant designed to help
        users learn, create, code, research, and explore ideas.
        Built for speed, intelligence, and a futuristic experience.
    </p>

    <button class="enterBtn">
        ENTER NOVA AI
    </button>
</div>

<!-- SOUND -->
<audio id="startupSound">
    <source src="startup.mp3" type="audio/mpeg">
</audio>

<script>

const bootLines = [
"[NOVA CORE] Initializing...",
"[NOVA CORE] Loading Neural Systems...",
"[NOVA CORE] Connecting Knowledge Modules...",
"[NOVA CORE] Running Security Checks...",
"[NOVA CORE] Voice Systems Online...",
"[NOVA CORE] Memory Loaded...",
"[NOVA CORE] Ready."
];

function startNova(){

    document.getElementById("startupSound").play().catch(()=>{});

    document.getElementById("startScreen").style.display="none";
    document.getElementById("bootScreen").style.display="block";

    let terminal = document.getElementById("terminal");
    let bar = document.getElementById("bar");

    let line = 0;

    const bootInterval = setInterval(()=>{

        if(line < bootLines.length){
            terminal.innerHTML += bootLines[line] + "\n";
            bar.style.width = ((line+1)/bootLines.length)*100 + "%";
            line++;
        }
        else{

            clearInterval(bootInterval);

            setTimeout(()=>{

                document.getElementById("bootScreen").style.display="none";

                document.getElementById("aboutScreen").style.display="flex";

            },1000);
        }

    },900);
}
</script>

</body>
</html>
