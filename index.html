<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Orbitron,sans-serif;overflow:hidden}
#matrix,#stars,.scan{position:fixed;inset:0}
#matrix{z-index:0}
#stars{background:
radial-gradient(circle at 20% 20%,#00e5ff 1px,transparent 2px),
radial-gradient(circle at 80% 40%,#fff 1px,transparent 2px),
radial-gradient(circle at 40% 80%,#00e5ff 1px,transparent 2px);
background-size:300px 300px;opacity:.35;animation:drift 20s linear infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-300px)}}
.scan{height:2px;background:#00e5ff;box-shadow:0 0 20px #00e5ff;animation:scan 5s linear infinite;z-index:2}
@keyframes scan{from{top:-5px}to{top:100%}}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:3}
.logo{font-size:6rem;color:#00e5ff;text-shadow:0 0 30px #00e5ff}
.orb{width:180px;height:180px;border-radius:50%;margin-bottom:25px;
background:radial-gradient(circle,#00e5ff,#003cff,#000);
box-shadow:0 0 40px #00e5ff,0 0 100px #00e5ff;
animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-15px)}}

.btn{padding:16px 40px;border:none;border-radius:14px;background:#00e5ff;
font-weight:bold;cursor:pointer;margin-top:25px}

#boot{display:none;padding:40px;align-items:flex-start;justify-content:flex-start}
#terminal{white-space:pre-wrap;color:#00ff88;font-family:Consolas,monospace;line-height:1.8}
.barwrap{width:100%;border:1px solid #00ff88;height:22px;margin-top:20px}
.bar{height:100%;width:0;background:#00ff88}
#pct{margin-top:10px;color:#00ff88}

#about{display:none}
.card{width:min(900px,90%);padding:40px;border-radius:24px;
background:rgba(255,255,255,.06);backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.15);text-align:center}
.card h1{color:#00e5ff;margin-bottom:20px}
.card p{line-height:1.8;color:#ddd}
.stats{margin:25px 0;display:grid;gap:10px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px #00e5ff,0 0 60px #00e5ff}}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="stars"></div>
<div class="scan"></div>

<div id="start" class="screen">
<div class="orb"></div>
<div class="logo">NOVA</div>
<div>ADVANCED AI SYSTEM</div>
<button class="btn" onclick="startNova()">START SYSTEM</button>
</div>

<div id="boot" class="screen">
<div id="terminal"></div>
<div class="barwrap"><div class="bar" id="bar"></div></div>
<div id="pct">0%</div>
</div>

<div id="about" class="screen">
<div class="card">
<h1>NOVA AI</h1>
<p>Nova AI is a futuristic assistant built with Google AI Studio to help users create, learn, code, research and solve problems faster.</p>
<div class="stats">
<div>⚡ Response Engine: Online</div>
<div>🧠 Neural Modules: Active</div>
<div>🌐 Endpoint: codex-nova.ai.studio</div>
</div>
<button class="btn pulse" onclick="location.href='https://codex-nova.ai.studio'">ENTER NOVA AI</button>
</div>
</div>

<audio id="startup"><source src="assets/startup.mp3" type="audio/mpeg"></audio>

<script>
const c=document.getElementById('matrix'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); onresize=resize;
const cols=Math.floor(innerWidth/20), drops=Array(cols).fill(1);
setInterval(()=>{
x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,0,c.width,c.height);
x.fillStyle='#00ff88'; x.font='15px monospace';
drops.forEach((d,i)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*20,d*20); if(d*20>c.height&&Math.random()>.975)drops[i]=0; drops[i]++;});
},50);

const lines=[
"[NOVA CORE] Initializing...",
"[NOVA CORE] Loading Neural Engine...",
"[NOVA CORE] Security Checks Passed...",
"[NOVA CORE] Connected to codex-nova.ai.studio",
"[NOVA CORE] Synchronizing Intelligence...",
"[NOVA CORE] Nova AI Ready."
];

async function typeLine(el,text){
 for(let ch of text){el.innerHTML+=ch; await new Promise(r=>setTimeout(r,25));}
 el.innerHTML+="\\n";
}

async function startNova(){
 document.getElementById('startup').play().catch(()=>{});
 start.style.display='none';
 boot.style.display='flex';
 for(let i=0;i<lines.length;i++){
   await typeLine(terminal,lines[i]);
   let v=Math.floor(((i+1)/lines.length)*100);
   bar.style.width=v+'%'; pct.textContent=v+'%';
 }
 document.body.animate([{filter:'brightness(1)'},{filter:'brightness(2.5)'},{filter:'brightness(1)'}],{duration:400});
 setTimeout(()=>{boot.style.display='none';about.style.display='flex';},800);
}
</script>
</body>
</html>
