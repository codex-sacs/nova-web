<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="matrix"></canvas>
<div id="stars"></div>
<div class="scan"></div>

<div id="start" class="screen">
    <div class="orb"></div>
    <div class="logo">NOVA</div>
    <div>ADVANCED AI SYSTEM</div>

    <button class="btn" onclick="startNova()">
        START SYSTEM
    </button>
</div>

<div id="boot" class="screen">
    <div id="terminal"></div>

    <div class="barwrap">
        <div class="bar" id="bar"></div>
    </div>

    <div id="pct">0%</div>
</div>

<div id="about" class="screen">
    <div class="card">

        <h1>NOVA AI</h1>

        <p>
            Nova AI is a futuristic assistant built with
            Google AI Studio to help users create,
            learn, code, research and solve problems faster.
        </p>

        <div class="stats">
            <div>⚡ Response Engine: Online</div>
            <div>🧠 Neural Modules: Active</div>
            <div>🌐 Endpoint: codex-nova.ai.studio</div>
        </div>

        <button class="btn pulse"
        onclick="location.href='https://codex-nova.ai.studio'">
            ENTER NOVA AI
        </button>

    </div>
</div>

<audio id="startup">
    <source src="assets/startup.mp3" type="audio/mpeg">
</audio>

<script src="js/app.js"></script>

</body>
</html>
